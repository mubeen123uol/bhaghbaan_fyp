components:
  schemas:
    CareTask:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        plant_nickname:
          type: string
          readOnly: true
        task_type_display:
          type: string
          readOnly: true
        task_type:
          allOf:
          - $ref: '#/components/schemas/TaskTypeEnum'
          readOnly: true
        scheduled_date:
          type: string
          format: date
          readOnly: true
        status:
          $ref: '#/components/schemas/CareTaskStatusEnum'
        weather_note:
          type: string
          maxLength: 255
        completed_at:
          type: string
          format: date-time
          nullable: true
        reminder_sent:
          type: boolean
        user_plant:
          type: integer
          readOnly: true
      required:
      - id
      - plant_nickname
      - scheduled_date
      - task_type
      - task_type_display
      - user_plant
    CareTaskStatusEnum:
      enum:
      - PENDING
      - COMPLETED
      - SKIPPED
      - POSTPONED
      type: string
      description: |-
        * `PENDING` - Pending
        * `COMPLETED` - Completed
        * `SKIPPED` - Skipped
        * `POSTPONED` - Postponed for Weather
    ChatRoom:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        latest_message:
          allOf:
          - $ref: '#/components/schemas/Message'
          readOnly: true
        room_type:
          $ref: '#/components/schemas/RoomTypeEnum'
        name:
          type: string
          maxLength: 150
        created_at:
          type: string
          format: date-time
          readOnly: true
        garden:
          type: integer
          nullable: true
        group:
          type: integer
          nullable: true
        participant_one:
          type: integer
          nullable: true
        participant_two:
          type: integer
          nullable: true
      required:
      - created_at
      - id
      - latest_message
      - name
    ChatbotRequest:
      type: object
      properties:
        message:
          type: string
        session_id:
          type: integer
      required:
      - message
    ChatbotResponse:
      type: object
      properties:
        session_id:
          type: integer
        reply:
          type: string
      required:
      - reply
      - session_id
    DeviceToken:
      type: object
      properties:
        token:
          type: string
          maxLength: 255
        platform:
          type: string
          maxLength: 20
      required:
      - token
    Diagnosis:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
        image_hash:
          type: string
          readOnly: true
        detected_species:
          type: string
          readOnly: true
        detected_disease:
          type: string
          readOnly: true
        confidence:
          type: number
          format: double
          readOnly: true
        is_confident:
          type: boolean
          readOnly: true
        provider_used:
          type: string
          readOnly: true
        advice_en:
          type: string
          readOnly: true
        advice_ur:
          type: string
          readOnly: true
        advice_roman:
          type: string
          readOnly: true
        is_escalated:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
      required:
      - advice_en
      - advice_roman
      - advice_ur
      - confidence
      - created_at
      - detected_disease
      - detected_species
      - id
      - image
      - image_hash
      - is_confident
      - is_escalated
      - provider_used
      - user
    Disease:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        treatments:
          type: array
          items:
            $ref: '#/components/schemas/Treatment'
          readOnly: true
        name_en:
          type: string
          maxLength: 150
        name_ur:
          type: string
          maxLength: 150
        name_roman:
          type: string
          maxLength: 150
        scientific_name:
          type: string
          maxLength: 150
        symptoms_en:
          type: string
        symptoms_ur:
          type: string
        severity_level:
          $ref: '#/components/schemas/SeverityLevelEnum'
        sample_image:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        plants:
          type: array
          items:
            type: integer
      required:
      - created_at
      - id
      - name_en
      - name_ur
      - symptoms_en
      - symptoms_ur
      - treatments
    Expense:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        recorded_by_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 150
        category:
          $ref: '#/components/schemas/ExpenseCategoryEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        receipt_photo:
          type: string
          format: uri
          nullable: true
        expense_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
        garden:
          type: integer
          readOnly: true
        recorded_by:
          type: integer
          readOnly: true
      required:
      - amount
      - created_at
      - expense_date
      - garden
      - id
      - recorded_by
      - recorded_by_name
      - title
    ExpenseCategoryEnum:
      enum:
      - LABOR
      - PLANTS
      - FERTILIZER
      - TOOLS
      - OTHER
      type: string
      description: |-
        * `LABOR` - Labor / مالی کی اجرت
        * `PLANTS` - Plants & Saplings / پودے اور قلمیں
        * `FERTILIZER` - Fertilizer & Soil / کھاد اور بھل
        * `TOOLS` - Tools & Pots / گملے اور اوزار
        * `OTHER` - Other / دیگر اخراجات
    Garden:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/GardenMember'
          readOnly: true
        total_expenses:
          type: number
          format: double
          readOnly: true
        remaining_budget:
          type: number
          format: double
          readOnly: true
        name:
          type: string
          maxLength: 150
        location_address:
          type: string
        city:
          type: string
          maxLength: 100
        total_budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        created_at:
          type: string
          format: date-time
          readOnly: true
        owner:
          type: integer
          readOnly: true
      required:
      - created_at
      - id
      - location_address
      - members
      - name
      - owner
      - remaining_budget
      - total_expenses
    GardenMember:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_details:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        role:
          $ref: '#/components/schemas/GardenMemberRoleEnum'
        joined_at:
          type: string
          format: date-time
          readOnly: true
        garden:
          type: integer
          readOnly: true
        user:
          type: integer
      required:
      - garden
      - id
      - joined_at
      - user
      - user_details
    GardenMemberRoleEnum:
      enum:
      - GARDENER
      - SUPERVISOR
      type: string
      description: |-
        * `GARDENER` - Gardener / مالی
        * `SUPERVISOR` - Supervisor / نگران
    Group:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        member_count:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        description:
          type: string
        city:
          type: string
          maxLength: 100
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        image:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        creator:
          type: integer
          readOnly: true
      required:
      - created_at
      - creator
      - description
      - id
      - member_count
      - name
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sender_name:
          type: string
          readOnly: true
        content:
          type: string
        image_attachment:
          type: string
          format: uri
          nullable: true
        is_hidden:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        room:
          type: integer
          readOnly: true
        sender:
          type: integer
          readOnly: true
      required:
      - content
      - created_at
      - id
      - is_hidden
      - room
      - sender
      - sender_name
    NearbyGroupResponse:
      type: object
      properties:
        group:
          $ref: '#/components/schemas/Group'
        distance_km:
          type: number
          format: double
      required:
      - distance_km
      - group
    NearbyProfResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        distance_km:
          type: number
          format: double
      required:
      - distance_km
      - user
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        notification_type:
          $ref: '#/components/schemas/NotificationTypeEnum'
        title:
          type: string
          maxLength: 200
        body:
          type: string
        target_url:
          type: string
          maxLength: 255
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        recipient:
          type: integer
          readOnly: true
      required:
      - body
      - created_at
      - id
      - recipient
      - title
    NotificationTypeEnum:
      enum:
      - CARE_REMINDER
      - TASK_UPDATE
      - ORDER_UPDATE
      - CHAT_MESSAGE
      - SYSTEM
      type: string
      description: |-
        * `CARE_REMINDER` - Care Reminder / پودوں کی دیکھ بھال
        * `TASK_UPDATE` - Task Update / کام کی اپڈیٹ
        * `ORDER_UPDATE` - Order Update / آرڈر کی تفصیل
        * `CHAT_MESSAGE` - New Message / نیا پیغام
        * `SYSTEM` - System Alert / سسٹم الرٹ
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          readOnly: true
        shipping_address:
          type: string
        shipping_city:
          type: string
          maxLength: 100
        contact_phone:
          type: string
          maxLength: 25
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        buyer:
          type: integer
          readOnly: true
      required:
      - buyer
      - contact_phone
      - created_at
      - delivery_fee
      - id
      - items
      - shipping_address
      - shipping_city
      - status
      - status_display
      - subtotal
      - total_amount
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product_title:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        order:
          type: integer
        product:
          type: integer
        seller:
          type: integer
      required:
      - id
      - order
      - product
      - product_title
      - seller
      - unit_price
    OrderStatusEnum:
      enum:
      - PLACED
      - CONFIRMED
      - SHIPPED
      - DELIVERED
      - CANCELLED
      type: string
      description: |-
        * `PLACED` - Order Placed (COD) / آرڈر موصول ہوا
        * `CONFIRMED` - Confirmed / تصدیق شدہ
        * `SHIPPED` - Dispatched / روانہ کر دیا گیا
        * `DELIVERED` - Delivered & Paid / پہنچ گیا اور ادائیگی مکمل
        * `CANCELLED` - Cancelled / منسوخ شدہ
