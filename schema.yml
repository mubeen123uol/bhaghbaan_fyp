        - Frost Protection / سردی سے بچاؤ ❄️"
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    Treatment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        treatment_type:
          $ref: '#/components/schemas/TreatmentTypeEnum'
        title_en:
          type: string
          maxLength: 180
        title_ur:
          type: string
          maxLength: 180
        instructions_en:
          type: string
        instructions_ur:
          type: string
        safety_disclaimer_ur:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        disease:
          type: integer
      required:
      - created_at
      - disease
      - id
      - instructions_en
      - instructions_ur
      - title_en
      - title_ur
    TreatmentTypeEnum:
      enum:
      - ORGANIC
      - CHEMICAL
      type: string
      description: |-
        * `ORGANIC` - Organic / دیسی اور گھریلو علاج
        * `CHEMICAL` - Chemical / کیمیکل اور زرعی ادویات
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/UserRoleEnum'
        phone:
          type: string
          nullable: true
          maxLength: 25
        city:
          type: string
          maxLength: 100
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        preferred_language:
          $ref: '#/components/schemas/PreferredLanguageEnum'
        bio:
          type: string
        is_verified_professional:
          type: boolean
          readOnly: true
        years_of_experience:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        hourly_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_verified_professional
      - username
    UserPlant:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        care_tasks:
          type: array
          items:
            $ref: '#/components/schemas/CareTask'
          readOnly: true
        health_photos:
          type: array
          items:
            $ref: '#/components/schemas/PlantPhoto'
          readOnly: true
        plant_details:
          allOf:
          - $ref: '#/components/schemas/Plant'
          readOnly: true
        nickname:
          type: string
          maxLength: 120
        location_description:
          type: string
          maxLength: 120
        is_indoor:
          type: boolean
        primary_photo:
          type: string
          format: uri
          nullable: true
        watering_interval_days:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        last_watered_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
        plant_template:
          type: integer
          nullable: true
        garden:
          type: integer
          nullable: true
      required:
      - care_tasks
      - created_at
      - health_photos
      - id
      - nickname
      - plant_details
      - user
    UserRoleEnum:
      enum:
      - HOMEOWNER
      - GARDENER
      - SUPERVISOR
      - SELLER
      - ADMIN
      type: string
      description: |-
        * `HOMEOWNER` - Homeowner
        * `GARDENER` - Gardener
        * `SUPERVISOR` - Supervisor
        * `SELLER` - Seller
        * `ADMIN` - Admin
    VerificationStatusEnum:
      enum:
      - PENDING
      - VERIFIED
      - REJECTED
      - SUSPENDED
      type: string
      description: |-
        * `PENDING` - Pending Admin Verification
        * `VERIFIED` - Verified Seller
        * `REJECTED` - Rejected
        * `SUSPENDED` - Suspended
    WeatherSnapshot:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        city:
          type: string
          maxLength: 100
        temperature:
          type: number
          format: double
        precipitation_mm:
          type: number
          format: double
        forecast_24h_rain_mm:
          type: number
          format: double
        weather_condition:
          type: string
          maxLength: 100
        fetched_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - fetched_at
      - id
      - temperature
      - weather_condition
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
